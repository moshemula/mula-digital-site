  <script>
  (function(){
    'use strict';
    // mobile menu
    (function(){
      var burger=document.getElementById('burger'), mobile=document.getElementById('mobileMenu'), overlay=document.getElementById('mmOverlay'), closeBtn=document.getElementById('mmClose');
      function closeMobile(){if(mobile)mobile.classList.remove('open');if(overlay)overlay.classList.remove('open');if(burger){burger.classList.remove('open');burger.setAttribute('aria-expanded','false');}document.body.style.overflow='';}
      if(burger&&mobile){
        burger.addEventListener('click',function(){
          var open=mobile.classList.toggle('open'); burger.classList.toggle('open',open);
          if(overlay) overlay.classList.toggle('open',open);
          burger.setAttribute('aria-expanded',open?'true':'false'); document.body.style.overflow=open?'hidden':'';
        });
        if(closeBtn) closeBtn.addEventListener('click',closeMobile);
        if(overlay) overlay.addEventListener('click',closeMobile);
        var touchStartX=0,touchDelta=0;
        mobile.addEventListener('touchstart',function(e){touchStartX=e.touches[0].clientX;touchDelta=0;},{passive:true});
        mobile.addEventListener('touchmove',function(e){touchDelta=e.touches[0].clientX-touchStartX;},{passive:true});
        mobile.addEventListener('touchend',function(){if(touchDelta>60)closeMobile();},{passive:true});
        document.addEventListener('keydown',function(e){if(e.key==='Escape'&&mobile.classList.contains('open'))closeMobile();});
        document.querySelectorAll('.m-sub-toggle').forEach(function(t){
          t.setAttribute('aria-expanded','false');
          t.addEventListener('click',function(){ var s=document.getElementById(t.getAttribute('data-sub')); var o=s.classList.toggle('open'); t.setAttribute('aria-expanded',o?'true':'false'); });
        });
      /* click-based mega menu */
      var megaItems=document.querySelectorAll('.nav-item.has-mega');
      function closeAllMegas(){megaItems.forEach(function(m){m.classList.remove('mega-open');});}
      megaItems.forEach(function(item){
        var link=item.querySelector('.nav-link');
        if(!link)return;
        link.addEventListener('click',function(e){
          if(window.innerWidth<=880)return;
          /* the panel is already open on hover, so let the click through */
          if(megaHoverOn())return;
          e.preventDefault();
          var wasOpen=item.classList.contains('mega-open');
          closeAllMegas();
          if(!wasOpen)item.classList.add('mega-open');
        });
      });
      document.addEventListener('click',function(e){if(!e.target.closest('.nav-item.has-mega'))closeAllMegas();});
      document.addEventListener('keydown',function(e){if(e.key==='Escape')closeAllMegas();});
      /* hover opens it on a real pointer; click still works for touch */
      var megaHover=window.matchMedia('(hover:hover) and (pointer:fine)');
      var megaCloseTimer;
      function megaHoverOn(){return megaHover.matches&&window.innerWidth>880;}
      megaItems.forEach(function(item){
        item.addEventListener('mouseenter',function(){
          if(!megaHoverOn())return;
          clearTimeout(megaCloseTimer);
          if(item.classList.contains('mega-open'))return;
          closeAllMegas();
          item.classList.add('mega-open');
        });
        item.addEventListener('mouseleave',function(){
          if(!megaHoverOn())return;
          clearTimeout(megaCloseTimer);
          megaCloseTimer=setTimeout(function(){item.classList.remove('mega-open');},220);
        });
      });

      /* scroll detection */
      var hdr=document.querySelector('header.nav');
      if(hdr){var onScroll=function(){hdr.classList.toggle('scrolled',window.scrollY>30);};window.addEventListener('scroll',onScroll,{passive:true});onScroll();}
        mobile.querySelectorAll('a').forEach(function(a){
          a.addEventListener('click',function(){ closeMobile(); });
        });
      }
    })();
    var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var isTouch=window.matchMedia('(hover: none)').matches;
    document.getElementById('y').textContent=new Date().getFullYear();
    var bar=document.querySelector('#progress span');
    addEventListener('scroll',function(){var h=document.documentElement;bar.style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%';},{passive:true});

    /* --- GSAP animations --- */
    if(window.gsap&&window.ScrollTrigger&&!reduce){
      gsap.registerPlugin(ScrollTrigger);
      gsap.set('.reveal',{opacity:1,y:0});

      // Hero text split
      var title=document.querySelector('.c-title');
      if(title){
        var raw=title.textContent;
        title.innerHTML=raw.split('').map(function(c){
          return c===' '?' ':'<span class="ch" style="display:inline-block">'+c+'</span>';
        }).join('');
        gsap.from(title.querySelectorAll('.ch'),{opacity:0,y:30,rotateX:-90,duration:.4,stagger:.02,ease:'power2.out',delay:.2});
      }

      // Hero subtitle
      gsap.from('.crumbs',{y:20,opacity:0,duration:.4,ease:'power3.out'});
      gsap.from('.c-sub',{y:20,opacity:0,duration:.7,ease:'power3.out',delay:.6});

      // Form card slide in with rotation
      gsap.from('.form-card',{y:60,opacity:0,rotateX:5,duration:.9,ease:'power2.out',delay:.4,transformOrigin:'top center'});

      // Info cards stagger with scale
      gsap.from('.sidebar .info-card',{x:80,opacity:0,scale:.9,duration:.5,stagger:.1,ease:'power2.out',delay:.5});

      // Hours card
      gsap.from('.hours-card',{x:80,opacity:0,scale:.9,duration:.5,ease:'power2.out',delay:.9});

      // Map card with clip reveal
      var mapCard=document.querySelector('.map-card');
      if(mapCard){
        mapCard.style.clipPath='inset(0 100% 0 0)';
        gsap.to(mapCard,{clipPath:'inset(0 0% 0 0)',duration:.8,ease:'power3.inOut',delay:1.1});
      }

      // Bottom CTA with text split
      var ctaH2=document.querySelector('.bottom-cta h2');
      if(ctaH2){
        gsap.from('.bottom-cta',{y:40,opacity:0,duration:.7,ease:'power2.out',
          scrollTrigger:{trigger:'.bottom-cta',start:'top 85%',once:true}});
      }

      // Magnetic buttons
      if(!isTouch){
        document.querySelectorAll('.btn-primary, .btn-ghost, .btn-map').forEach(function(b){
          b.addEventListener('mousemove',function(e){
            var r=b.getBoundingClientRect();
            b.style.transform='translate('+((e.clientX-(r.left+r.width/2))*.15)+'px,'+((e.clientY-(r.top+r.height/2))*.25)+'px)';
          });
          b.addEventListener('mouseleave',function(){b.style.transform='';});
        });
      }

      // Card hover tilt
      if(!isTouch){
        document.querySelectorAll('.info-card').forEach(function(card){
          card.addEventListener('mousemove',function(e){
            var r=card.getBoundingClientRect();
            var x=(e.clientX-r.left)/r.width-.5;
            var y=(e.clientY-r.top)/r.height-.5;
            card.style.transform='perspective(600px) rotateY('+x*6+'deg) rotateX('+(-y*6)+'deg) translateY(-3px)';
          });
          card.addEventListener('mouseleave',function(){
            card.style.transform='';card.style.transition='transform .4s ease';
            setTimeout(function(){card.style.transition='';},400);
          });
        });
      }

    } else {
      document.querySelectorAll('.reveal').forEach(function(el){el.classList.add('in');});
    }

  })();
  </script>
