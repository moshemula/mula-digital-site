<style>
:root{--ink:#0E0E12;--soft:#3f3f46;--muted:#8A8A92;--line:#ECECEC;--bg:#FFFFFF;--grad:linear-gradient(120deg,#E8003D,#7B2FBE)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font-family:Assistant,system-ui,Arial,sans-serif;padding:24px 16px;text-align:center}
.box{max-width:540px;width:100%}
.bar{width:56px;height:4px;border-radius:2px;background:var(--grad);margin:0 auto 24px}

p{color:var(--soft);font-size:18px;line-height:1.7;margin:0 0 6px}
.sig{color:var(--muted);font-size:15px;margin-top:18px}
.cta{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:26px}
.cta a{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:999px;text-decoration:none;font-weight:600;font-size:16px;transition:transform .2s,box-shadow .2s}
.cta a svg{width:18px;height:18px;flex:none}
.p{background:var(--grad);color:#fff}
.s{border:1px solid var(--line);color:var(--ink)}
.cta a:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(123,47,190,.18)}
.cta a:focus-visible{outline:2px solid #7B2FBE;outline-offset:3px}
.ltr{direction:ltr;unicode-bidi:isolate}
@media (prefers-reduced-motion:reduce){.cta a{transition:none}.cta a:hover{transform:none}}
</style>
</head>
