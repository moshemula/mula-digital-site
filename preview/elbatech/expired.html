*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:24px 16px;text-align:center}

.cta a{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:999px;text-decoration:none;font-weight:600;font-size:15px;transition:transform .2s,box-shadow .2s,background .2s}
.cta a svg{width:18px;height:18px}
.p{background:var(--grad);color:#fff}
.s{border:1px solid var(--line);color:var(--ink)}
.cta a:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(123,47,190,.18)}
.cta a:focus-visible{outline:2px solid #7B2FBE;outline-offset:3px}
