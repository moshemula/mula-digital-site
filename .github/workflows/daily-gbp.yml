name: פוסט יומי בגוגל לעסק

on:
  schedule:
    # 06:00 UTC = 09:00 בישראל בשעון קיץ (08:00 בשעון חורף)
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-gbp
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: פרסום הפריט הבא מהמאגר
        env:
          GBP_CLIENT_ID:     ${{ secrets.GBP_CLIENT_ID }}
          GBP_CLIENT_SECRET: ${{ secrets.GBP_CLIENT_SECRET }}
          GBP_REFRESH_TOKEN: ${{ secrets.GBP_REFRESH_TOKEN }}
          GBP_ACCOUNT_ID:    ${{ secrets.GBP_ACCOUNT_ID }}
          GBP_LOCATION_ID:   ${{ secrets.GBP_LOCATION_ID }}
        run: python tools_gbp_daily.py

      - name: שמירת מיקום המונה
        run: |
          if [ -n "$(git status --porcelain gbp-queue.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add gbp-queue.json
            git commit -m "פוסט יומי ב-GBP: קידום המונה [skip ci]"
            git push
          else
            echo "המונה לא זז - לא פורסם פוסט"
          fi
