name: פיד ופרסום בגוגל לעסק

# רץ בכל דחיפה ל-main. feed.xml מוחרג כדי שהקומיט של
# הוורקפלואו עצמו לא יפעיל אותו שוב.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'feed.xml'
  # הפעלה ידנית: Actions -> הוורקפלואו הזה -> Run workflow
  # משאירים ריק = רק בונה את הפיד.
  # כותבים שם קובץ = מפרסם אותו ב-GBP עכשיו.
  workflow_dispatch:
    inputs:
      page:
        description: 'שם הקובץ לפרסום ב-GBP (למשל daf-nechita.html). ריק = רק בניית פיד'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: משיכת הקוד
        uses: actions/checkout@v4
        with:
          fetch-depth: 0      # כל ההיסטוריה, כדי לזהות מה נוסף ומה השתנה בדחיפה

      - name: התקנת פייתון
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: זיהוי דפים חדשים בדחיפה הזו
        id: newpages
        run: |
          if [ "$(git rev-list --count HEAD)" -gt 1 ]; then
            ADDED=$(git diff --name-only --diff-filter=A HEAD^ HEAD -- '*.html' | tr '\n' ' ')
          else
            ADDED=""
          fi
          MANUAL="${{ github.event.inputs.page }}"
          if [ -n "$MANUAL" ]; then
            ADDED="$MANUAL"
            echo "פרסום ידני: $MANUAL"
          fi
          echo "added=${ADDED}" >> "$GITHUB_OUTPUT"
          echo "לפרסום: ${ADDED:-אין}"

      - name: עדכון בינג ומנועי חיפוש (IndexNow) על דפים חדשים ומעודכנים
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          BASE="$BEFORE"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then BASE="HEAD^"; fi
          python3 tools_indexnow.py $(git diff --name-only --diff-filter=AM "$BASE" HEAD -- '*.html' 'sitemap.xml' | tr '\n' ' ') || echo "IndexNow נכשל, ממשיכים"

      - name: בניית feed.xml מחדש
        run: python tools_feed.py

      - name: שמירת הפיד אם השתנה
        run: |
          if [ -n "$(git status --porcelain feed.xml)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add feed.xml
            git commit -m "עדכון אוטומטי של feed.xml [skip ci]"
            git push
            echo "הפיד עודכן ונדחף"
          else
            echo "אין שינוי בפיד"
          fi

      - name: פרסום הדפים החדשים בגוגל לעסק
        if: steps.newpages.outputs.added != ''
        env:
          GBP_CLIENT_ID:     ${{ secrets.GBP_CLIENT_ID }}
          GBP_CLIENT_SECRET: ${{ secrets.GBP_CLIENT_SECRET }}
          GBP_REFRESH_TOKEN: ${{ secrets.GBP_REFRESH_TOKEN }}
          GBP_ACCOUNT_ID:    ${{ secrets.GBP_ACCOUNT_ID }}
          GBP_LOCATION_ID:   ${{ secrets.GBP_LOCATION_ID }}
        run: python tools_gbp_post.py ${{ steps.newpages.outputs.added }}
